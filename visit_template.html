<style>
/* Layout: full-bleed render; a quiet glass HUD in the four corners (room card, plan, time of day, tour strip).
   One deliberate dark look in every theme, so the picture stays the brightest thing on screen. */
:root {
  --night: #121413;                 /* page ground behind the canvas */
  --glass: rgba(20, 23, 21, 0.62);  /* HUD panels */
  --glass-hi: rgba(32, 36, 33, 0.82);
  --chalk: #f1f0ec;                 /* text */
  --mist: #b9bdb4;                  /* secondary text */
  --sage: #a9b99d;                  /* accent, the moodboard's sage lifted for a dark ground */
  --oak: #d6b27c;                   /* time-of-day / sun */
  --line: rgba(241, 240, 236, 0.16);
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--chalk); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
#stage canvas:active { cursor: grabbing; }
.panel { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line); border-radius: 12px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

/* room card */
#room { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 14px 18px 14px; max-width: min(380px, calc(100vw - 32px)); display: grid; gap: 4px; }
.eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist); }
#roomName { font-family: var(--f-display); font-size: clamp(24px, 3.2vw, 34px); line-height: 1.08; font-weight: 400; margin: 0; text-wrap: balance; }
#roomNote { margin: 2px 0 0; color: var(--mist); max-width: 46ch; line-height: 1.45; }
#roomMeta { font-family: var(--f-mono); font-size: 11.5px; color: var(--sage); font-variant-numeric: tabular-nums; }

/* plan */
#mapWrap { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 8px; display: grid; gap: 4px; }
#map { width: 210px; height: auto; display: block; cursor: crosshair; touch-action: none; }
.mapcap { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--mist); padding: 0 2px; }

/* bottom bar */
#bar { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid;
  grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; pointer-events: none; }
#bar > * { pointer-events: auto; }
#tour { display: flex; align-items: center; gap: 6px; padding: 6px; min-width: 0; }
#stops { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; scroll-behavior: smooth; }
#stops::-webkit-scrollbar { display: none; }
.stop { flex: none; padding: 8px 12px; border-radius: 8px; color: var(--mist); white-space: nowrap; font-weight: 500; transition: background .2s, color .2s; }
.stop:hover { color: var(--chalk); background: rgba(241, 240, 236, 0.06); }
.stop[aria-current="true"] { color: var(--night); background: var(--chalk); }
.stop b { font-family: var(--f-mono); font-weight: 400; font-size: 11px; margin-right: 6px; opacity: .7; }
.iconbtn { flex: none; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--chalk); }
.iconbtn:hover { background: rgba(241, 240, 236, 0.08); }
.iconbtn svg { width: 18px; height: 18px; }
#play { width: auto; padding: 0 12px 0 10px; gap: 6px; display: flex; align-items: center; font-weight: 600; background: var(--sage); color: var(--night); white-space: nowrap; }
#play:hover { background: var(--chalk); }

/* guided tour card */
#guide { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(640px, calc(100vw - 32px)); padding: 14px 16px 12px; display: grid; gap: 8px; }
#guide h3 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.1; margin: 0; text-wrap: balance; }
#gText { margin: 0; color: var(--chalk); line-height: 1.5; max-width: 62ch; min-height: 3em; }
#gText.fresh, #guide h3.fresh { animation: rise .7s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#gProg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
#gProg i { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; display: block; }
#gProg i b { display: block; height: 100%; width: 0; background: var(--oak); }
#gProg i.done b { width: 100%; }
.gbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.gbtn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 500; color: var(--chalk); }
.gbtn:hover { border-color: rgba(241,240,236,.4); }
.gbtn.end { margin-left: auto; }
.mono { font-family: var(--f-mono); font-size: 11.5px; color: var(--oak); font-variant-numeric: tabular-nums; }
body.guided #bar, body.guided #help { display: none; }
#guide.monkeys h3 { color: var(--oak); }

#tools { display: grid; gap: 8px; padding: 10px 12px; width: 300px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
#clock { font-family: var(--f-mono); font-size: 12px; color: var(--oak); font-variant-numeric: tabular-nums; min-width: 9ch; }
#tod { flex: 1; min-width: 0; accent-color: var(--oak); }
.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.chip { padding: 6px 4px; border-radius: 7px; font-size: 12.5px; color: var(--mist); border: 1px solid var(--line); text-align: center; }
.chip:hover { color: var(--chalk); border-color: rgba(241,240,236,.32); }
.chip[aria-pressed="true"] { color: var(--night); background: var(--oak); border-color: var(--oak); }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.mode { padding: 9px 8px; border-radius: 8px; font-weight: 600; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 7px; }
.mode:hover { border-color: rgba(241,240,236,.36); }
.mode[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.mode svg { width: 16px; height: 16px; }
#status { font-family: var(--f-mono); font-size: 11px; color: var(--mist); min-height: 1.3em; font-variant-numeric: tabular-nums; }

#help { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; color: var(--mist);
  transition: opacity .6s; white-space: nowrap; }
#help kbd { font-family: var(--f-mono); font-size: 11px; color: var(--chalk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

#loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); transition: opacity .8s; z-index: 5; }
#loader div { display: grid; gap: 10px; justify-items: center; text-align: center; padding-inline: 16px; }
#loader h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 5vw, 44px); margin: 0; }
#loader h1 em { color: var(--sage); }
#loadMsg { font-family: var(--f-mono); font-size: 12px; color: var(--mist); }
#loader.gone { opacity: 0; pointer-events: none; }

@media (max-width: 860px) {
  #help { display: none; }
  #bar { grid-template-columns: minmax(0, 1fr); }
  #tools { width: auto; }
  #map { width: 150px; }
  #roomNote { display: none; }
}
@media (max-width: 520px) {
  #mapWrap { display: none; }
  #room { right: 16px; }
}
@media (max-height: 560px) {
  .presets, #roomNote, #mapWrap, #help { display: none; }
  #tools { gap: 6px; padding: 8px 10px; }
  #roomName { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { #loader, .stop, #help { transition: none; } #gText.fresh, #guide h3.fresh { animation: none; } }

// ---------- procedural textures (canvas, so the page needs no image hosts) ----------
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function canvasTex(size, draw, { srgb = true, repeat = 1 } = {}) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);

// oak planks: 1 texture = 2.4 m square, planks 18 cm wide, staggered butt joints
function oakPlanks(rough) {
  return canvasTex(1024, (x, s) => {
    seed = 3; const pw = s / (2.4 / 0.18), rows = Math.ceil(s / pw);
    for (let r = 0; r < rows; r++) {
      let y0 = r * pw, xx = -rnd() * s * 0.5;
      while (xx < s) {
        const len = s * (0.35 + rnd() * 0.45);
        const tone = rough ? 150 + rnd() * 40 : 0;
        if (rough) { x.fillStyle = `rgb(${tone},${tone},${tone})`; }
        else { const h = 31 + rnd() * 6, l = 56 + rnd() * 10, sat = 46 + rnd() * 12; x.fillStyle = `hsl(${h} ${sat}% ${l}%)`; }

        x.fillRect(xx + len - 1, y0, 1.5, pw); xx += len;

    }
    noise(x, s, rough ? 18 : 10);
  }, { srgb: !rough });
}
function tiles(c1, joint, tw, th, sizeM) { // tw/th in metres
  return canvasTex(512, (x, s) => {
    seed = 5; const k = s / sizeM; x.fillStyle = joint; x.fillRect(0, 0, s, s);
    for (let j = 0; j < sizeM / th; j++) for (let i = 0; i < sizeM / tw; i++) {

}

}
function lawn() {
  return canvasTex(512, (x, s) => { seed = 13; x.fillStyle = "#5f7d3f"; x.fillRect(0, 0, s, s);

}
function facade() { // 3 m storey bands with windows, 1 texture = 6 m
  return canvasTex(512, (x, s) => { const k = s / 6; x.fillStyle = "#ece9e2"; x.fillRect(0, 0, s, s); noise(x, s, 6);

// planar UVs from world coordinates, metres -> texture units
function worldUV(o, scale) {
  const g = o.geometry, p = g.attributes.position, n = g.attributes.normal;

  const v = new THREE.Vector3(), nm = new THREE.Vector3(), nmat = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);

  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
    if (n) nm.fromBufferAttribute(n, i).applyMatrix3(nmat).normalize(); else nm.set(0, 1, 0);

  }
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
}

  camera.fov = Math.max(30, Math.min(80, camera.fov + e.deltaY * 0.03)); camera.updateProjectionMatrix(); markDirty();
}, { passive: false });

const keys = new Set();
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input,button") && !/^(Arrow|Key[WASD])/.test(e.code)) return;
  if (e.target.tagName === "INPUT") return;
  if (/^(Arrow(Up|Down|Left|Right)|Key[WASDQE]|ShiftLeft|ShiftRight)$/.test(e.code)) { keys.add(e.code); if (e.code.startsWith("Arrow")) e.preventDefault(); stopTour(); glide = null; }
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("keydown", (e) => { if (e.key === "Escape" && guide) { if (troop) endTroop(true); endGuide(); } });
addEventListener("blur", () => keys.clear());
function stepBy(fwd, side) {
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), sx = Math.cos(yaw), sz = -Math.sin(yaw);
  const dx = fx * fwd + sx * side, dz = fz * fwd + sz * side;
  const p = camera.position;
  if (!blocked(p.x + dx, p.z + dz)) { p.x += dx; p.z += dz; }
  else { if (!blocked(p.x + dx, p.z)) p.x += dx; else if (!blocked(p.x, p.z + dz)) p.z += dz; }
  markDirty();
}

// ---------- dollhouse ----------
function setMode(m, quiet) {
  mode = m;
  $("doll").setAttribute("aria-pressed", m === "orbit" ? "true" : "false");
  if (m === "orbit") {
    glide = null; stopTour();
    roofMass.visible = false; cutPlane.constant = 2.35;
    orbit.target.set(CENTER.x, 0, CENTER.z - 1);
    camera.position.set(CENTER.x + 13, 17, CENTER.z - 14);
    camera.fov = 40; camera.updateProjectionMatrix();
    orbit.enabled = true; orbit.update();
    $("roomName").textContent = "The whole flat"; $("roomNote").textContent = "94 m² inside, 76.3 m² of garden. Drag to turn, scroll to zoom; pick a stop to step back in.";
    $("roomMeta").textContent = "3½ rooms · Erdgeschoss"; lastPlace = "";
  } else {
    orbit.enabled = false; roofMass.visible = true; cutPlane.constant = 1000;
    camera.fov = 62; camera.updateProjectionMatrix();
    if (!quiet) goStop(stopIdx);
  }
  markDirty();
}
$("doll").onclick = () => setMode(mode === "orbit" ? "walk" : "orbit");

// ---------- time of day ----------
let clock = 8.5, skyState = null, baseExposure = 1;
function fmtClock(t) { const h = Math.floor(t), m = Math.round((t - h) * 60); return `${String(h + (m === 60 ? 1 : 0)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; }
function setClock(t) {
  clock = t;
  const sun = sunAt(t), sky = skyParams(sun);
  skyState = sky;
  const night = 1 - sstep(-0.12, 0.06, Math.sin(sun.el));
  renderSky(sun, night);
  const T = sunTransmittance(sun.el), Tmax = Math.max(...T, 1e-4), Tl = 0.2126 * T[0] + 0.7152 * T[1] + 0.0722 * T[2];
  sunLight.visible = sun.el > -0.01 && Tl > 0.002;
  sunLight.color.setRGB(T[0] / Tmax, T[1] / Tmax, T[2] / Tmax);
  sunLight.intensity = 3.9 * Math.pow(Tl, 0.8) * sstep(-0.01, 0.05, Math.sin(sun.el));
  sunLight.position.copy(CENTER).addScaledVector(sun.dir, 40); sunLight.target.position.copy(CENTER);
  fill.intensity = 0.85 * sky.day + 0.04;
  if (scene.fog) scene.fog.color.setRGB(...mix([0.02, 0.025, 0.04], [0.74, 0.8, 0.86], sky.day).map((v, i) => Math.min(1, v * (1 - 0.35 * sky.warm) + sky.hor[i] * 0.35 * sky.warm)));
  fill.color.setRGB(...mix([0.95, 0.96, 0.97], sky.hor.map((v) => Math.min(1, v)), 0.6 * sky.warm));
  for (const l of lamps) {
    l.light.intensity = l.power * Math.max(night, 0.0);
    for (const m of l.shades) { m.emissive.set(0xffcf94); m.emissiveIntensity = 1.6 * night; }
  }
  baseExposure = 0.92 + 0.35 * night;
  renderer.toneMappingExposure = baseExposure * (photoOn ? 1.45 : 1);
  finish.quad.material.uniforms.exposure.value = baseExposure;
  finish.quad.material.uniforms.warmth.value = 0.5 + 0.5 * Math.max(night, sky.warm);
  shafts.strength = 1 - night;
  if (aquarium) { aquarium.led.intensity = 0.25 + 0.9 * night; for (const m of causticMats) m.uniforms.uGain.value = 0.35 + 0.9 * night; }
  $("clock").textContent = fmtClock(t);
  $("tod").value = t;
  document.querySelectorAll(".presets .chip").forEach((c) => c.setAttribute("aria-pressed", Math.abs(Number(c.dataset.t) - t) < 0.3 ? "true" : "false"));
  if (pt && photoOn) { scene.environment = scene.background = skyDataTexture(); pt.updateEnvironment(); pt.updateLights(); pt.updateMaterials(); pt.reset(); }
  markDirty();
}
$("tod").addEventListener("input", (e) => setClock(Number(e.target.value)));
document.querySelectorAll(".presets .chip").forEach((c) => c.onclick = () => setClock(Number(c.dataset.t)));

// ---------- photo mode: progressive path tracing ----------
let pt = null, photoOn = false, ptLoading = false;
const glassPhoto = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, metalness: 0, transmission: 1, ior: 1.5, thickness: 0.006 });
const glassRaster = new Map();
function setStatus(t) { $("status").textContent = t; }
async function setPhoto(on) {
  if (on === photoOn || ptLoading) return;
  if (on) {
    ptLoading = true; $("photo").setAttribute("aria-pressed", "true");
    setStatus("Loading the path tracer…");
    try {
      const { WebGLPathTracer } = await import("three-gpu-pathtracer");
      setStatus("Preparing the scene…");
      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 30)));
      for (const g of glassMeshes) { glassRaster.set(g, g.material); g.material = glassPhoto; }
      scene.traverse((o) => { if (o.userData.caustic) o.visible = false; });
      for (const o of photoHide) o.visible = false;
      scene.environment = scene.background = skyDataTexture();
      if (!pt) {
        pt = new WebGLPathTracer(renderer);
        pt.tiles.set(touch ? 3 : 2, touch ? 3 : 2);
        pt.bounces = 6; pt.filteredGlossyFactor = 0.5; pt.minSamples = 1; pt.fadeDuration = 300;
        pt.renderScale = touch ? 0.6 : Math.min(1, 1.25 / renderer.getPixelRatio());
        pt.dynamicLowRes = true;
      }
      pt.setScene(scene, camera);
      photoOn = true; renderer.toneMappingExposure = baseExposure * 1.45;
    } catch (e) {
      console.error(e);
      for (const [g, m] of glassRaster) g.material = m;
      scene.traverse((o) => { if (o.userData.caustic) o.visible = true; });
      for (const o of photoHide) o.visible = true;
      scene.environment = scene.background = envRT.texture;
      $("photo").setAttribute("aria-pressed", "false");
      setStatus("Photo mode needs WebGL 2 and the jsDelivr CDN; it could not start here.");
    }
    ptLoading = false;
  } else {
    photoOn = false; $("photo").setAttribute("aria-pressed", "false"); renderer.toneMappingExposure = baseExposure;
    for (const [g, m] of glassRaster) g.material = m;
    scene.traverse((o) => { if (o.userData.caustic) o.visible = true; });
    for (const o of photoHide) o.visible = true;
    scene.environment = scene.background = envRT.texture;
    setStatus(""); markDirty();
  }
}
$("photo").onclick = () => setPhoto(!photoOn);

// ---------- plan ----------
const map = $("map"), mx = map.getContext("2d");
const MAP = { x0: 2.6, z0: -7.6, x1: 17.0, z1: 17.8 };
let mapScale = 1, mapOx = 0, mapOy = 0;
function layoutMap() {
  // brochure orientation: x to the right, z downwards, north to the left
  const W = map.width, H = map.height, sx = W / (MAP.x1 - MAP.x0), sz = H / (MAP.z1 - MAP.z0);
  mapScale = Math.min(sx, sz); mapOx = (W - (MAP.x1 - MAP.x0) * mapScale) / 2; mapOy = (H - (MAP.z1 - MAP.z0) * mapScale) / 2;
}
const toMap = (x, z) => [mapOx + (x - MAP.x0) * mapScale, mapOy + (z - MAP.z0) * mapScale];
const fromMap = (u, v) => [(u - mapOx) / mapScale + MAP.x0, (v - mapOy) / mapScale + MAP.z0];
let mapBase = null;
function drawMapBase() {
  layoutMap();
  const c = document.createElement("canvas"); c.width = map.width; c.height = map.height; const x = c.getContext("2d");
  const poly = (r) => { x.beginPath(); r.forEach(([a, b], i) => { const [u, v] = toMap(a, b); i ? x.lineTo(u, v) : x.moveTo(u, v); }); x.closePath(); };
  for (const g of INFO.grounds) { const [a, b, cc, d] = g.rect, [u0, v0] = toMap(a, b), [u1, v1] = toMap(cc, d);
    x.fillStyle = /Lawn/.test(g.name) ? "rgba(140,170,110,0.35)" : /Kerb/.test(g.name) ? "rgba(200,195,185,0.35)" : "rgba(215,205,190,0.32)"; x.fillRect(u0, v0, u1 - u0, v1 - v0); }
  for (const r of INFO.rooms) { const [a, b, cc, d] = r.bounds, [u0, v0] = toMap(a, b), [u1, v1] = toMap(cc, d); x.fillStyle = "rgba(214,178,124,0.16)"; x.fillRect(u0, v0, u1 - u0, v1 - v0); }
  x.fillStyle = "rgba(241,240,236,0.18)";
  for (const it of ITEMS) { if (!it.rects || it.type === "rug" || it.mount === "ceiling") continue;
    const a = (it.rot ?? 0) * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
    for (const [x0, z0, x1, z1] of it.rects) poly([[x0, z0], [x1, z0], [x1, z1], [x0, z1]].map(([p, q]) => [it.x + p * cs + q * sn, it.z - p * sn + q * cs])), x.fill(); }
  x.fillStyle = "#f1f0ec";
  for (const p of INFO.obstacles.walls) { poly(p[0]); x.fill(); }
  x.fillStyle = "rgba(241,240,236,0.45)";
  for (const p of INFO.obstacles.fixtures) { poly(p[0]); x.fill(); }
  x.font = "500 17px Karla, sans-serif"; x.fillStyle = "rgba(241,240,236,0.72)"; x.textAlign = "center";
  for (const r of INFO.rooms) { if (r.name === "Reduit" || r.name === "Bad") continue; const [a, b, cc, d] = r.bounds, [u, v] = toMap((a + cc) / 2, (b + d) / 2);
    x.save(); x.translate(u, v); if (cc - a < d - b) x.rotate(-Math.PI / 2); x.fillText(r.name === "Wohnen / Essen" ? "Wohnen" : r.name, 0, 5); x.restore(); }
  mapBase = c;
}
function drawMap() {
  if (!mapBase) return;
  mx.clearRect(0, 0, map.width, map.height); mx.drawImage(mapBase, 0, 0);
  if (mode !== "walk") return;
  const [u, v] = toMap(camera.position.x, camera.position.z);
  const f = -Math.sin(yaw), g = -Math.cos(yaw), half = (camera.fov * camera.aspect / 2) * Math.PI / 180 * 0.55, L = 44;
  const dir = Math.atan2(g, f);
  const grad = mx.createRadialGradient(u, v, 2, u, v, L); grad.addColorStop(0, "rgba(214,178,124,0.65)"); grad.addColorStop(1, "rgba(214,178,124,0)");
  mx.fillStyle = grad; mx.beginPath(); mx.moveTo(u, v); mx.arc(u, v, L, dir - half, dir + half); mx.closePath(); mx.fill();
  mx.fillStyle = "#d6b27c"; mx.strokeStyle = "#121413"; mx.lineWidth = 3; mx.beginPath(); mx.arc(u, v, 6.5, 0, 7); mx.fill(); mx.stroke();
}
map.addEventListener("click", (e) => {
  const r = map.getBoundingClientRect();
  const [x, z] = fromMap((e.clientX - r.left) * map.width / r.width, (e.clientY - r.top) * map.height / r.height);
  if (blocked(x, z)) { setStatus("That spot is inside a wall or a piece of furniture."); setTimeout(() => setStatus(photoOn ? $("status").textContent : ""), 2200); return; }
  stopTour(); if (mode !== "walk") setMode("walk", true);
  glideTo([x, floorAt(x, z) + EYE, z], { yaw, pitch: 0 }, 1.6);
});

// ---------- loop ----------
let dirty = true, last = performance.now();
const frustum = new THREE.Frustum(), projView = new THREE.Matrix4();
function markDirty() { dirty = true; }
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix(); markDirty();
}
addEventListener("resize", resize);
let camKey = "";
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (guide && !guide.paused && (!troop || guide.phase === "move") && mode === "walk") updateGuide(dt);
  if (mode === "walk" && !photoOn) checkReduitDoor();
  if (troop || reader) updateTroop(dt);
  if (mode === "walk") {
    if (glide) {
      const t = Math.min(1, (now - glide.t0) / glide.dur), e = ease(t);
      camera.position.lerpVectors(glide.p0, glide.p1, e);
      yaw = glide.y0 + (glide.y1 - glide.y0) * e; pitch = glide.q0 + (glide.q1 - glide.q0) * e;
      applyLook(); markDirty();
      if (t >= 1) glide = null;
    }
    if (keys.size) {
      const sp = (keys.has("ShiftLeft") || keys.has("ShiftRight") ? 2.6 : 1.35) * dt;
      const fwd = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
      const side = (keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0);
      const turn = (keys.has("ArrowLeft") || keys.has("KeyQ") ? 1 : 0) - (keys.has("ArrowRight") || keys.has("KeyE") ? 1 : 0);
      if (turn) { yaw += turn * 1.6 * dt; applyLook(); markDirty(); }
      if (fwd || side) stepBy(fwd * sp, side * sp);
      const ty = floorAt(camera.position.x, camera.position.z) + EYE;
      camera.position.y += (ty - camera.position.y) * Math.min(1, dt * 6);
    }
    updateRoomCard();
  } else orbit.update();
  const key = camera.position.toArray().map((v) => v.toFixed(4)).join() + camera.quaternion.toArray().map((v) => v.toFixed(4)).join() + camera.fov;
  if (photoOn && pt) {
    if (key !== camKey) { pt.updateCamera(); }
    camKey = key;
    pt.renderSample();
    const n = Math.floor(pt.samples);
    setStatus(n < 2 ? "Path tracing… hold still" : `Photo · ${n} samples${n < 60 ? " · refining" : ""}`);
    drawMap();
    return;
  }
  camKey = key;
  if (aquarium && aquarium.group.parent) {
    aquarium.box ??= new THREE.Box3().setFromObject(aquarium.group);
    frustum.setFromProjectionMatrix(projView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    if (frustum.intersectsBox(aquarium.box) && aquarium.box.distanceToPoint(camera.position) < 9) { causticTime.value = now / 1000; dirty = true; }
  }
  if (!dirty) return;
  dirty = false;
  renderer.shadowMap.needsUpdate = true;
  composer.render();
  drawMap();
}

// ---------- boot ----------
const loadMsg = (t) => { $("loadMsg").textContent = t; };
const bytes = Uint8Array.from(atob(GLB), (c) => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, "", async (gltf) => {
  dressModel(gltf.scene);
  world.add(gltf.scene);
  const walls = gltf.scene.getObjectByName("walls");
  const box = new THREE.Box3().setFromObject(walls ?? gltf.scene);
  CENTER.set((box.min.x + box.max.x) / 2, 0, (box.min.z + box.max.z) / 2);
  addSurroundings(box);
  addNeighbourhood(box);
  shafts.march.material.uniforms.roof.value.set(box.min.x, box.min.z, box.max.x, box.max.z);
  loadMsg(`Furnishing ${ITEMS.length} pieces…`);
  await new Promise((r) => setTimeout(r, 20));
  buildFurniture();
  furnRoot.traverse((o) => { if (o.isMesh && o.material && !o.material.transparent) o.receiveShadow = true; });
  collectFurnBoxes();
  buildTribe();
  drawMapBase();
  renderStops();
  resize();
  setClock(8.5);
  const s = STOPS[0]; camera.position.set(...s.pos); ({ yaw, pitch } = lookAngles(s.pos, s.tgt)); applyLook(); markStop(0);
  updateRoomCard(true);
  requestAnimationFrame(frame);
  setTimeout(() => $("loader").classList.add("gone"), 150);
  if (touch) $("help").textContent = "Drag to look · tap the floor to walk · two fingers to step";
  setTimeout(() => { $("help").style.opacity = "0"; }, 9000);
}, (e) => loadMsg("The model could not be loaded: " + e.message));
</script>
